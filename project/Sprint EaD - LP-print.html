<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sprint EaD — Pare de se perder. Comece a executar.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --ink: #1a0f2e;
    --ink-2: #2a1a4a;
    --bg: #fdfaf6;
    --bg-2: #f5efe6;
    --orange: #ff6a1f;
    --orange-2: #ff8a3d;
    --orange-deep: #e85410;
    --purple: #2a1260;
    --purple-deep: #1a0a40;
    --line: rgba(26, 15, 46, 0.10);
  }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  html, body { background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .text-ink { color: var(--ink); }
  .text-ink-soft { color: rgba(26, 15, 46, 0.65); }
  .text-ink-mute { color: rgba(26, 15, 46, 0.45); }
  .bg-ink { background: var(--ink); }
  .bg-purple { background: var(--purple); }
  .bg-purple-deep { background: var(--purple-deep); }
  .bg-orange { background: var(--orange); }
  .bg-orange-deep { background: var(--orange-deep); }
  .bg-paper { background: var(--bg); }
  .bg-paper-2 { background: var(--bg-2); }
  .border-line { border-color: var(--line); }
  .text-orange { color: var(--orange); }

  .grid-paper {
    background-image:
      linear-gradient(to right, rgba(26, 15, 46, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(26, 15, 46, 0.05) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .grid-paper-dark {
    background-image:
      linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* No animations in print */
  .marquee-track { animation: none !important; }
  .pulse-dot { animation: none !important; }
  .bob { animation: none !important; }

  .underline-accent {
    background-image: linear-gradient(transparent 65%, rgba(255, 106, 31, 0.35) 65%);
    background-repeat: no-repeat;
    background-size: 100% 100%;
    padding: 0 0.1em;
  }

  .btn-shadow {
    box-shadow: 0 1px 0 rgba(0,0,0,0.05), 0 8px 24px -8px rgba(255, 106, 31, 0.5);
  }

  .row-tick { border-bottom: 1px solid var(--line); }

  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }

  .hero-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
  }

  .card-elev {
    box-shadow: 0 1px 0 rgba(26,15,46,0.04), 0 16px 40px -20px rgba(26,15,46,0.15);
  }

  .dotted-rule {
    background-image: radial-gradient(circle, rgba(26,15,46,0.25) 1px, transparent 1px);
    background-size: 8px 1px;
    background-repeat: repeat-x;
    background-position: left center;
    height: 1px;
  }

  details[open] .chev { transform: rotate(45deg); }

  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
    letter-spacing: 0.02em; text-transform: uppercase;
    border: 1px solid var(--line); background: rgba(255,255,255,0.6);
  }

  /* Force all <details> open on print */
  details { }

  /* Print-specific */
  @page { size: A4 portrait; margin: 10mm; }

  @media print {
    html, body { background: var(--bg) !important; }
    header.sticky { position: static !important; }
    /* hide tweaks panel if any */
    .tweaks-panel, [data-tweaks-panel] { display: none !important; }

    /* avoid splitting key blocks */
    section { break-inside: avoid; page-break-inside: avoid; }
    .card-elev, .rounded-2xl, .rounded-xl { break-inside: avoid; page-break-inside: avoid; }
    h1, h2, h3 { break-after: avoid; page-break-after: avoid; }

    /* page breaks between major sections */
    section + section { break-before: auto; }
    section.page-break { break-before: page; page-break-before: always; }

    /* disable blurry orbs that can look weird in print */
    .hero-orb { display: none !important; }

    /* Force-open all FAQ items so the content prints */
    details { }
  }
</style>
</head>

<body class="antialiased">

<div id="app"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="lp.jsx"></script>

<script type="text/babel">
  // Wait for fonts + JSX render, then open print dialog.
  (async () => {
    try {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
    } catch (e) {}

    // Wait for the app to mount
    const waitForApp = () => new Promise((resolve) => {
      const check = () => {
        const el = document.getElementById("app");
        if (el && el.children.length > 0) resolve();
        else setTimeout(check, 100);
      };
      check();
    });
    await waitForApp();

    // Open every <details> so FAQ content is visible in print
    document.querySelectorAll("details").forEach((d) => d.setAttribute("open", ""));

    // Mark major sections with page-break hint (every other section)
    const sections = document.querySelectorAll("section");
    sections.forEach((s, i) => { if (i > 0) s.classList.add("page-break"); });

    // Extra safety wait
    setTimeout(() => { window.print(); }, 800);
  })();
</script>

</body>
</html>
